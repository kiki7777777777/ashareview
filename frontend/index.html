<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A股量化仪表盘</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <span class="logo">📈 A股量化</span>
      <span id="market-status" class="conn-badge conn-unknown">● 检测中</span>
      <span id="conn-status"   class="conn-badge conn-ok">● akshare · 东方财富</span>
    </div>
    <div class="search-bar">
      <input id="symbol-input" type="text" placeholder="股票代码  如 600519" maxlength="6" />
      <button id="analyze-btn" onclick="analyze()">分析</button>
    </div>
    <div class="quick-symbols" id="quick-symbols"></div>
  </header>

  <main class="main">
    <div id="main-content">
      <div class="placeholder">
        <div class="placeholder-icon">📊</div>
        <p>输入 A 股代码开始分析</p>
        <p class="placeholder-sub">支持沪深A股全市场 · 数据来自东方财富 · 局域网内无需VPN</p>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
